<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pulse Analytics — Minimalist Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            canvas: '#0b0c0e',
            card: '#141519',
            cardHover: '#181a1f',
            borderSubtle: 'rgba(255, 255, 255, 0.07)',
            borderMuted: 'rgba(255, 255, 255, 0.03)',
            accentMint: '#34d399',
            accentMintSoft: 'rgba(52, 211, 153, 0.12)',
            accentMuted: '#60a5fa',
            textPrimary: '#f0f0f4',
            textSecondary: '#717582',
            textTertiary: '#4a4d57',
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }
    body {
      background-color: #0b0c0e;
      color: #f0f0f4;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: pan-y;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
    }
    .chart-surface {
      touch-action: none;
    }
    .tooltip-bubble {
      pointer-events: none;
      transition: opacity 0.15s ease-out, transform 0.06s ease-out;
    }
    .tab-slider {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), width 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Tactile press response */
    .tactile-btn {
      transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.14s ease;
    }
    .tactile-btn:active {
      transform: scale(0.96);
    }
    .card-interact {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, background-color 0.2s ease;
    }
    .card-interact:active {
      transform: scale(0.985);
    }
  </style>
</head>
<body class="min-h-screen bg-canvas antialiased selection:bg-neutral-800 selection:text-white flex justify-center py-0 sm:py-6 px-0 sm:px-4">

  <main class="w-full max-w-xl bg-canvas sm:bg-canvas/50 sm:border sm:border-borderSubtle sm:rounded-[28px] p-4 sm:p-7 min-h-screen sm:min-h-0 flex flex-col gap-6">

    <!-- Header Section -->
    <header id="animHeader" class="flex items-center justify-between pt-2 sm:pt-0 opacity-0">
      <div class="flex items-center gap-3">
        <div class="relative w-10 h-10 rounded-2xl bg-card border border-borderSubtle flex items-center justify-center text-textPrimary font-semibold text-sm shadow-inner group">
          <svg class="w-5 h-5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
          </svg>
          <span class="absolute -top-0.5 -right-0.5 flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accentMint opacity-60"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-accentMint"></span>
          </span>
        </div>
        <div>
          <h1 class="text-base font-semibold text-textPrimary tracking-tight">Pulse Studio</h1>
          <p class="text-xs text-textSecondary flex items-center gap-1.5 font-normal">
            <span>Production API</span>
            <span class="w-1 h-1 rounded-full bg-textTertiary"></span>
            <span class="text-emerald-400 font-medium">99.98% sync</span>
          </p>
        </div>
      </div>

      <!-- Live Refresh Button with micro-spring interaction -->
      <button id="refreshBtn" class="tactile-btn w-9 h-9 rounded-xl bg-card border border-borderSubtle hover:bg-cardHover flex items-center justify-center text-textSecondary hover:text-textPrimary" title="Refresh metrics" aria-label="Refresh">
        <svg id="refreshIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
      </button>
    </header>

    <div id="animControls" class="relative bg-card border border-borderSubtle p-1 rounded-2xl flex items-center justify-between opacity-0">
      <div id="periodSlider" class="tab-slider absolute top-1 bottom-1 left-1 rounded-xl bg-neutral-800/80 border border-white/10 shadow-sm pointer-events-none"></div>
      
      <button class="period-btn tactile-btn relative z-10 flex-1 py-1.5 text-xs font-medium text-textPrimary text-center transition-colors" data-period="24h">24h</button>
      <button class="period-btn tactile-btn relative z-10 flex-1 py-1.5 text-xs font-medium text-textSecondary text-center transition-colors" data-period="7d">7d</button>
      <button class="period-btn tactile-btn relative z-10 flex-1 py-1.5 text-xs font-medium text-textSecondary text-center transition-colors" data-period="30d">30d</button>
      <button class="period-btn tactile-btn relative z-10 flex-1 py-1.5 text-xs font-medium text-textSecondary text-center transition-colors" data-period="all">All</button>
    </div>

    <section id="animKpis" class="grid grid-cols-2 gap-3 opacity-0">
      <!-- Card 1: Gross Revenue -->
      <div class="card-interact col-span-2 bg-card border border-borderSubtle rounded-2xl p-4 sm:p-5 flex flex-col justify-between relative overflow-hidden">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs uppercase tracking-wider font-medium text-textSecondary">Gross Revenue</span>
          <span id="trendRevenue" class="inline-flex items-center gap-1 text-[11px] font-medium text-accentMint bg-accentMintSoft px-2 py-0.5 rounded-full transition-transform">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" />
            </svg>
            <span id="trendRevenueText">+14.8%</span>
          </span>
        </div>
        <div class="flex items-baseline gap-2">
          <span class="text-2xl sm:text-3xl font-semibold tracking-tight text-textPrimary">₽</span>
          <h2 id="metricRevenueVal" class="text-2xl sm:text-3xl font-semibold tracking-tight text-textPrimary font-mono">248,390</h2>
          <span class="text-xs text-textSecondary font-normal">vs prev period</span>
        </div>
      </div>

      <!-- Card 2: Successful Orders -->
      <div class="card-interact bg-card border border-borderSubtle rounded-2xl p-4 flex flex-col justify-between">
        <span class="text-xs font-medium text-textSecondary tracking-tight">Active Orders</span>
        <div class="mt-2 flex flex-col">
          <span id="metricOrdersVal" class="text-lg sm:text-xl font-semibold text-textPrimary tracking-tight font-mono">1,429</span>
          <span id="trendOrders" class="text-[11px] text-accentMint font-medium mt-0.5">+8.4%</span>
        </div>
      </div>

      <!-- Card 3: Conversion Rate -->
      <div class="card-interact bg-card border border-borderSubtle rounded-2xl p-4 flex flex-col justify-between">
        <span class="text-xs font-medium text-textSecondary tracking-tight">Conversion</span>
        <div class="mt-2 flex flex-col">
          <div class="flex items-baseline">
            <span id="metricConversionVal" class="text-lg sm:text-xl font-semibold text-textPrimary tracking-tight font-mono">4.62</span>
            <span class="text-sm font-semibold text-textPrimary ml-0.5">%</span>
          </div>
          <span id="trendConversion" class="text-[11px] text-neutral-400 font-medium mt-0.5">+0.3%</span>
        </div>
      </div>
    </section>

    <section id="animChart" class="bg-card border border-borderSubtle rounded-2xl p-4 sm:p-5 flex flex-col relative opacity-0">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-sm font-semibold text-textPrimary">Revenue Velocity</h3>
          <p class="text-xs text-textSecondary transition-opacity duration-200" id="chartDateRange">Last 24 Hours performance</p>
        </div>
        <div class="flex items-center gap-1.5 text-xs text-textSecondary bg-cardHover border border-borderSubtle px-2.5 py-1 rounded-xl">
          <span class="w-1.5 h-1.5 rounded-full bg-accentMint animate-pulse"></span>
          <span>Live feed</span>
        </div>
      </div>

      <!-- Chart Viewport Container -->
      <div class="relative w-full h-48 sm:h-52 chart-surface select-none" id="chartContainer">
        <!-- Floating Interactive Tooltip -->
        <div id="chartTooltip" class="tooltip-bubble absolute top-0 left-0 bg-neutral-900/95 border border-white/10 text-white rounded-xl px-3 py-1.5 shadow-2xl backdrop-blur-md opacity-0 z-20 flex flex-col pointer-events-none transform -translate-x-1/2 -translate-y-full">
          <span id="tooltipDate" class="text-[10px] text-neutral-400 font-medium tracking-wide uppercase">14:00</span>
          <span id="tooltipVal" class="text-xs font-semibold text-textPrimary">₽ 18,200</span>
        </div>

        <!-- Pure SVG Dynamic Path & Area -->
        <svg id="chartSvg" class="w-full h-full overflow-visible" preserveAspectRatio="none" viewBox="0 0 500 200">
          <defs>
            <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#34d399" stop-opacity="0.18" />
              <stop offset="65%" stop-color="#34d399" stop-opacity="0.03" />
              <stop offset="100%" stop-color="#34d399" stop-opacity="0.0" />
            </linearGradient>

            <linearGradient id="strokeGradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#34d399" />
              <stop offset="50%" stop-color="#4ade80" />
              <stop offset="100%" stop-color="#a7f3d0" />
            </linearGradient>
          </defs>

          <!-- Horizontal Subtle Grid lines -->
          <line x1="0" y1="40" x2="500" y2="40" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="4 4" />
          <line x1="0" y1="100" x2="500" y2="100" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="4 4" />
          <line x1="0" y1="160" x2="500" y2="160" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="4 4" />

          <!-- Dynamic SVG Shapes -->
          <path id="chartArea" d="" fill="url(#chartGradient)" opacity="0" />
          <path id="chartLine" d="" fill="none" stroke="url(#strokeGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Scrub guide indicator line -->
          <line id="scrubLine" x1="0" y1="10" x2="0" y2="190" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0" />

          <!-- Interactive active point dot -->
          <circle id="scrubDotOuter" cx="0" cy="0" r="6" fill="#34d399" fill-opacity="0.25" opacity="0" />
          <circle id="scrubDot" cx="0" cy="0" r="3.5" fill="#f0f0f4" stroke="#34d399" stroke-width="2" opacity="0" />
        </svg>
      </div>

      <!-- Chart bottom labels -->
      <div id="chartXLabels" class="flex justify-between items-center text-[10px] text-textTertiary mt-2 font-medium">
        <span>Start</span>
        <span>Mid</span>
        <span>Now</span>
      </div>
    </section>

    <section id="animActivity" class="flex flex-col gap-3 pb-4 opacity-0">
      <div class="flex items-center justify-between px-0.5">
        <h3 class="text-sm font-semibold text-textPrimary">Recent Activity</h3>

        <!-- Filter Chips -->
        <div class="flex items-center gap-1">
          <button class="filter-chip tactile-btn active text-[11px] px-2.5 py-1 rounded-lg font-medium bg-cardHover border border-white/10 text-textPrimary" data-filter="all">All</button>
          <button class="filter-chip tactile-btn text-[11px] px-2.5 py-1 rounded-lg font-medium text-textSecondary hover:text-textPrimary" data-filter="income">Income</button>
          <button class="filter-chip tactile-btn text-[11px] px-2.5 py-1 rounded-lg font-medium text-textSecondary hover:text-textPrimary" data-filter="payout">Payout</button>
        </div>
      </div>

      <!-- Transaction List -->
      <div id="transactionList" class="flex flex-col gap-2 min-h-[140px]">
        <!-- Populated via script -->
      </div>
    </section>

  </main>

  <script>
    const DATASETS = {
      '24h': {
        revenueNum: 248390,
        revenueTrend: '+14.8%',
        ordersNum: 1429,
        ordersTrend: '+8.4%',
        conversionNum: 4.62,
        conversionTrend: '+0.3%',
        dateRange: 'Past 24 Hours performance',
        xLabels: ['00:00', '08:00', '16:00', 'Now'],
        dataPoints: [
          { label: '00:00', value: 8200 },
          { label: '03:00', value: 5400 },
          { label: '06:00', value: 6800 },
          { label: '09:00', value: 14500 },
          { label: '12:00', value: 21300 },
          { label: '15:00', value: 18900 },
          { label: '18:00', value: 27400 },
          { label: '21:00', value: 31200 },
          { label: 'Now',   value: 29800 }
        ]
      },
      '7d': {
        revenueNum: 1489120,
        revenueTrend: '+21.3%',
        ordersNum: 8940,
        ordersTrend: '+12.1%',
        conversionNum: 4.88,
        conversionTrend: '+0.6%',
        dateRange: 'Past 7 Days performance',
        xLabels: ['Mon', 'Wed', 'Fri', 'Sun'],
        dataPoints: [
          { label: 'Mon', value: 184000 },
          { label: 'Tue', value: 162000 },
          { label: 'Wed', value: 210000 },
          { label: 'Thu', value: 198000 },
          { label: 'Fri', value: 245000 },
          { label: 'Sat', value: 278000 },
          { label: 'Sun', value: 292000 }
        ]
      },
      '30d': {
        revenueNum: 5830400,
        revenueTrend: '+18.2%',
        ordersNum: 34120,
        ordersTrend: '+9.7%',
        conversionNum: 4.45,
        conversionTrend: '-0.1%',
        dateRange: 'Past 30 Days aggregated',
        xLabels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
        dataPoints: [
          { label: 'W1', value: 1120000 },
          { label: 'W2', value: 1350000 },
          { label: 'W3', value: 1480000 },
          { label: 'W4', value: 1880400 }
        ]
      },
      'all': {
        revenueNum: 38190000,
        revenueTrend: '+84.6%',
        ordersNum: 218500,
        ordersTrend: '+45.2%',
        conversionNum: 4.71,
        conversionTrend: '+1.2%',
        dateRange: 'All-time platform totals',
        xLabels: ['Q1', 'Q2', 'Q3', 'Q4'],
        dataPoints: [
          { label: 'Q1', value: 6500000 },
          { label: 'Q2', value: 8900000 },
          { label: 'Q3', value: 10400000 },
          { label: 'Q4', value: 12390000 }
        ]
      }
    };

    const TRANSACTIONS = [
      { id: 1, type: 'income', title: 'Telegram Stars Checkout #8942', time: '14:28', amount: '+₽ 1,890', status: 'Settled' },
      { id: 2, type: 'income', title: 'Pro Annual License #8941', time: '13:50', amount: '+₽ 8,400', status: 'Settled' },
      { id: 3, type: 'payout', title: 'Card Payout to **4910', time: '12:14', amount: '-₽ 45,000', status: 'Processing' },
      { id: 4, type: 'income', title: 'API Key Usage (1.2M reqs)', time: '11:05', amount: '+₽ 3,250', status: 'Settled' },
      { id: 5, type: 'income', title: 'Telegram Stars Checkout #8940', time: '09:42', amount: '+₽ 1,890', status: 'Settled' },
    ];

    let currentPeriod = '24h';
    let currentFilter = 'all';
    let activePoints = [];
    let prevMetrics = {
      revenue: 0,
      orders: 0,
      conversion: 0
    };

    // DOM References
    const periodButtons = document.querySelectorAll('.period-btn');
    const periodSlider = document.getElementById('periodSlider');
    const metricRevenueVal = document.getElementById('metricRevenueVal');
    const trendRevenueText = document.getElementById('trendRevenueText');
    const metricOrdersVal = document.getElementById('metricOrdersVal');
    const trendOrders = document.getElementById('trendOrders');
    const metricConversionVal = document.getElementById('metricConversionVal');
    const trendConversion = document.getElementById('trendConversion');
    const chartDateRange = document.getElementById('chartDateRange');
    const chartXLabels = document.getElementById('chartXLabels');
    const chartLine = document.getElementById('chartLine');
    const chartArea = document.getElementById('chartArea');
    const chartContainer = document.getElementById('chartContainer');
    const chartTooltip = document.getElementById('chartTooltip');
    const tooltipDate = document.getElementById('tooltipDate');
    const tooltipVal = document.getElementById('tooltipVal');
    const scrubLine = document.getElementById('scrubLine');
    const scrubDot = document.getElementById('scrubDot');
    const scrubDotOuter = document.getElementById('scrubDotOuter');
    const transactionList = document.getElementById('transactionList');
    const filterChips = document.querySelectorAll('.filter-chip');
    const refreshBtn = document.getElementById('refreshBtn');
    const refreshIcon = document.getElementById('refreshIcon');

    // Spline curve generator
    function getSplinePath(points) {
      if (points.length < 2) return '';
      let d = `M ${points[0].x} ${points[0].y}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i === 0 ? i : i - 1];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;

        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }
      return d;
    }

    function animateCounters(targetRevenue, targetOrders, targetConversion) {
      const counterObj = {
        rev: prevMetrics.revenue,
        ord: prevMetrics.orders,
        conv: prevMetrics.conversion
      };

      anime({
        targets: counterObj,
        rev: targetRevenue,
        ord: targetOrders,
        conv: targetConversion,
        round: 1,
        easing: 'easeOutExpo',
        duration: 900,
        update: function() {
          metricRevenueVal.textContent = Math.round(counterObj.rev).toLocaleString();
          metricOrdersVal.textContent = Math.round(counterObj.ord).toLocaleString();
          metricConversionVal.textContent = counterObj.conv.toFixed(2);
        },
        complete: function() {
          prevMetrics.revenue = targetRevenue;
          prevMetrics.orders = targetOrders;
          prevMetrics.conversion = targetConversion;
        }
      });
    }

    function renderChart(periodKey, isInitial = false) {
      const data = DATASETS[periodKey];
      const pts = data.dataPoints;

      const svgWidth = 500;
      const svgHeight = 200;
      const padTop = 30;
      const padBottom = 25;
      const padX = 20;

      const minVal = Math.min(...pts.map(p => p.value)) * 0.85;
      const maxVal = Math.max(...pts.map(p => p.value)) * 1.08;

      activePoints = pts.map((pt, i) => {
        const x = padX + (i / (pts.length - 1)) * (svgWidth - padX * 2);
        const y = svgHeight - padBottom - ((pt.value - minVal) / (maxVal - minVal)) * (svgHeight - padTop - padBottom);
        return { x, y, label: pt.label, value: pt.value };
      });

      const linePath = getSplinePath(activePoints);
      const firstX = activePoints[0].x;
      const lastX = activePoints[activePoints.length - 1].x;
      const areaPath = `${linePath} L ${lastX} ${svgHeight} L ${firstX} ${svgHeight} Z`;

      chartLine.setAttribute('d', linePath);
      chartArea.setAttribute('d', areaPath);

      // SVG Stroke Dashoffset animation on change or load
      const totalLen = chartLine.getTotalLength();
      chartLine.style.strokeDasharray = totalLen;
      chartLine.style.strokeDashoffset = totalLen;

      anime({
        targets: chartLine,
        strokeDashoffset: [totalLen, 0],
        easing: 'easeOutQuart',
        duration: isInitial ? 1100 : 750
      });

      anime({
        targets: chartArea,
        opacity: [0, 1],
        easing: 'easeOutQuad',
        duration: 800,
        delay: 200
      });

      // Update Labels and Trends
      chartXLabels.innerHTML = data.xLabels.map(l => `<span>${l}</span>`).join('');
      chartDateRange.textContent = data.dateRange;

      trendRevenueText.textContent = data.revenueTrend;
      trendOrders.textContent = data.ordersTrend;
      trendConversion.textContent = data.conversionTrend;

      animateCounters(data.revenueNum, data.ordersNum, data.conversionNum);
    }

    function updateSegmentSlider(button) {
      if (!button) return;
      const rect = button.getBoundingClientRect();
      const parentRect = button.parentElement.getBoundingClientRect();
      
      periodSlider.style.width = `${rect.width}px`;
      periodSlider.style.transform = `translateX(${rect.left - parentRect.left - 4}px)`;
    }

    periodButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const period = e.currentTarget.dataset.period;
        if (period === currentPeriod) return;

        currentPeriod = period;
        periodButtons.forEach(b => {
          b.classList.remove('text-textPrimary');
          b.classList.add('text-textSecondary');
        });
        e.currentTarget.classList.add('text-textPrimary');
        e.currentTarget.classList.remove('text-textSecondary');

        updateSegmentSlider(e.currentTarget);
        renderChart(currentPeriod);
        hideScrub();
      });
    });

    function handlePointerInteraction(e) {
      if (!activePoints || activePoints.length === 0) return;

      const rect = chartContainer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;

      if (clientX < rect.left || clientX > rect.right) {
        hideScrub();
        return;
      }

      const relX = ((clientX - rect.left) / rect.width) * 500;

      let closest = activePoints[0];
      let minDiff = Math.abs(relX - activePoints[0].x);

      for (let i = 1; i < activePoints.length; i++) {
        const diff = Math.abs(relX - activePoints[i].x);
        if (diff < minDiff) {
          minDiff = diff;
          closest = activePoints[i];
        }
      }

      scrubLine.setAttribute('x1', closest.x);
      scrubLine.setAttribute('x2', closest.x);
      scrubLine.setAttribute('opacity', '1');

      scrubDot.setAttribute('cx', closest.x);
      scrubDot.setAttribute('cy', closest.y);
      scrubDot.setAttribute('opacity', '1');

      scrubDotOuter.setAttribute('cx', closest.x);
      scrubDotOuter.setAttribute('cy', closest.y);
      scrubDotOuter.setAttribute('opacity', '1');

      tooltipDate.textContent = closest.label;
      tooltipVal.textContent = '₽ ' + closest.value.toLocaleString();

      const screenX = (closest.x / 500) * rect.width;
      const screenY = (closest.y / 200) * rect.height;

      chartTooltip.style.opacity = '1';
      chartTooltip.style.transform = `translate(${screenX}px, ${screenY - 14}px) translate(-50%, -100%)`;
    }

    function hideScrub() {
      scrubLine.setAttribute('opacity', '0');
      scrubDot.setAttribute('opacity', '0');
      scrubDotOuter.setAttribute('opacity', '0');
      chartTooltip.style.opacity = '0';
    }

    chartContainer.addEventListener('mousemove', handlePointerInteraction);
    chartContainer.addEventListener('mouseleave', hideScrub);
    chartContainer.addEventListener('touchstart', handlePointerInteraction, { passive: true });
    chartContainer.addEventListener('touchmove', handlePointerInteraction, { passive: true });
    chartContainer.addEventListener('touchend', hideScrub);
    chartContainer.addEventListener('touchcancel', hideScrub);

    function renderTransactions(filter = 'all', animate = true) {
      const filtered = TRANSACTIONS.filter(t => filter === 'all' || t.type === filter);
      
      transactionList.innerHTML = filtered.map(t => {
        const isIncome = t.type === 'income';
        const iconBg = isIncome ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400';
        const sign = isIncome ? 'text-accentMint' : 'text-neutral-300';

        return `
          <div class="transaction-item flex items-center justify-between p-3 rounded-2xl bg-card border border-borderSubtle card-interact cursor-pointer">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-9 h-9 rounded-xl ${iconBg} flex items-center justify-center flex-shrink-0">
                ${isIncome 
                  ? `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3" /></svg>`
                  : `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5L12 3m0 0l7.5 7.5M12 3v18" /></svg>`
                }
              </div>
              <div class="truncate">
                <h4 class="text-xs font-medium text-textPrimary truncate">${t.title}</h4>
                <p class="text-[11px] text-textSecondary">${t.time} • <span class="${t.status === 'Settled' ? 'text-neutral-400' : 'text-amber-400/80'}">${t.status}</span></p>
              </div>
            </div>
            <div class="text-right flex-shrink-0 pl-2">
              <span class="text-xs font-semibold ${sign}">${t.amount}</span>
            </div>
          </div>
        `;
      }).join('');

      if (animate) {
        anime({
          targets: '.transaction-item',
          opacity: [0, 1],
          translateY: [10, 0],
          easing: 'easeOutCubic',
          duration: 350,
          delay: anime.stagger(50)
        });
      }
    }

    filterChips.forEach(chip => {
      chip.addEventListener('click', (e) => {
        filterChips.forEach(c => {
          c.classList.remove('bg-cardHover', 'border', 'border-white/10', 'text-textPrimary');
          c.classList.add('text-textSecondary');
        });
        e.currentTarget.classList.add('bg-cardHover', 'border', 'border-white/10', 'text-textPrimary');
        e.currentTarget.classList.remove('text-textSecondary');
        
        currentFilter = e.currentTarget.dataset.filter;
        renderTransactions(currentFilter, true);
      });
    });

    // Tactile Refresh micro-interaction
    refreshBtn.addEventListener('click', () => {
      anime({
        targets: refreshIcon,
        rotate: '+=360',
        duration: 650,
        easing: 'easeInOutCubic'
      });
      renderChart(currentPeriod);
      renderTransactions(currentFilter, true);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const initialBtn = document.querySelector('[data-period="24h"]');
      updateSegmentSlider(initialBtn);

      // Initial chart & transaction render
      renderChart('24h', true);
      renderTransactions('all', false);

      // Staggered Entrance of entire interface with Anime.js
      anime.timeline({
        easing: 'easeOutExpo',
        duration: 600
      })
      .add({
        targets: '#animHeader',
        opacity: [0, 1],
        translateY: [12, 0]
      })
      .add({
        targets: '#animControls',
        opacity: [0, 1],
        translateY: [12, 0]
      }, '-=400')
      .add({
        targets: '#animKpis',
        opacity: [0, 1],
        translateY: [12, 0]
      }, '-=400')
      .add({
        targets: '#animChart',
        opacity: [0, 1],
        translateY: [12, 0]
      }, '-=400')
      .add({
        targets: '#animActivity',
        opacity: [0, 1],
        translateY: [12, 0]
      }, '-=400')
      .add({
        targets: '.transaction-item',
        opacity: [0, 1],
        translateY: [8, 0],
        delay: anime.stagger(45)
      }, '-=300');
    });

    window.addEventListener('resize', () => {
      const activeBtn = document.querySelector(`[data-period="${currentPeriod}"]`);
      updateSegmentSlider(activeBtn);
    });
  </script>
</body>
</html>
